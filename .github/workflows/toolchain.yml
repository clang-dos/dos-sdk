# Build the clang-dos toolchain packages (Linux and Windows hosts) from
# clang-dos/llvm, picolibc, JWlink, win16-sdk, win32-sdk, amiga-sdk, atari-sdk
# and this repository, and smoke-test them on every target in emu2, Wine,
# vamos and Hatari (with EmuTOS).
#
# It runs for pushes and pull requests here, and the other clang-dos
# repositories call it (workflow_call) for their own pull requests with their
# commit in place of the default branch. release.yml calls it to publish.
#
# The LLVM build is the slow part: about two hours for Linux and three for
# Windows on a cold cache. Each LLVM commit is built once per host and kept
# in the Actions cache, clang-dos/llvm publishes the ones on its main branch
# in its llvm-prebuilt release for the other repositories, and a compiler
# cache (ccache) makes a new LLVM commit quick to build.
#
# Jobs are few on purpose: the organization's runners are shared by every
# run in every repository, and each extra job waits in the queue.
name: Toolchain

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*']
  workflow_dispatch:
    inputs:
      llvm_ref:
        description: clang-dos/llvm branch, tag or commit
        default: main
      picolibc_ref:
        description: clang-dos/picolibc branch, tag or commit
        default: main
      jwlink_ref:
        description: clang-dos/JWlink branch, tag or commit
        default: master
      win16_sdk_ref:
        description: clang-dos/win16-sdk branch, tag or commit
        default: main
      win32_sdk_ref:
        description: clang-dos/win32-sdk branch, tag or commit
        default: main
      amiga_sdk_ref:
        description: clang-dos/amiga-sdk branch, tag or commit
        default: main
      atari_sdk_ref:
        description: clang-dos/atari-sdk branch, tag or commit
        default: main
      windows:
        description: Build the Windows-hosted package too
        type: boolean
        default: true
  workflow_call:
    inputs:
      llvm_ref:
        type: string
        default: main
      picolibc_ref:
        type: string
        default: main
      jwlink_ref:
        type: string
        default: master
      win16_sdk_ref:
        type: string
        default: main
      win32_sdk_ref:
        type: string
        default: main
      amiga_sdk_ref:
        type: string
        default: main
      atari_sdk_ref:
        type: string
        default: main
      sdk_ref:
        description: clang-dos/dos-sdk ref (default main, or this commit when run here)
        type: string
        default: ''
      windows:
        type: boolean
        default: true
    outputs:
      sources:
        description: The seven source commits, as one line for release notes
        value: ${{ jobs.setup.outputs.sources }}
      llvm_key:
        description: >
          LLVM commit and build script hash; the artifact llvm-HOST is
          published as llvm-HOST-KEY.tar.zst in clang-dos/llvm's llvm-prebuilt release
        value: ${{ jobs.llvm-linux.outputs.key }}

permissions:
  contents: read

# github.workflow is the calling workflow's name when this one is called, so
# a caller (which should set no concurrency of its own) gets its own group.
concurrency:
  group: toolchain-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # mingw-w64 for the Windows sysroots, and the other outside sources.
  MINGW_REPO: https://github.com/mingw-w64/mingw-w64
  MINGW_SHA: 7ce22f6637cc93fd2eb37c8a645908c92bb80bbd
  LIBUNICOWS_URL: https://downloads.sourceforge.net/project/libunicows/libunicows/1.1.2/libunicows-1.1.2-src.tar.gz
  LIBUNICOWS_SHA256: 4371837276fde33b5684556f4c8e37c348b330c2981d99626300c25b4d876a06
  # Turbo Vision, patched by tvision/clang-dos.patch (see tvision/README.md).
  TVISION_REPO: https://github.com/magiblot/tvision
  TVISION_SHA: b5fc1e50dcc2da062d72f43eb3662894d25aaf30
  EMU2_REPO: https://github.com/dmsc/emu2
  EMU2_SHA: 9d8698d06e67359bc8b230c2d19d5b1503e60819
  # EmuTOS (GPL), the free TOS that the Atari programs run on in Hatari.
  EMUTOS_VERSION: '1.4'
  EMUTOS_192K_SHA256: 59abac06a2d29b0864c5a7cfb2af65f022c337aed34188e174a9a08cc737e4bc
  EMUTOS_512K_SHA256: 1ef7bd25f61bcfc66d19debc2f0ebb0d5e5ba811ccd7f0fddfcb105bb72d1663
  # Wine's .spec files, which win16-sdk's headers are checked against.
  WINE_SPECS_TAG: wine-10.0

jobs:
  setup:
    name: Pick the source commits, build JWlink
    runs-on: ubuntu-24.04
    outputs:
      llvm: ${{ steps.refs.outputs.llvm }}
      picolibc: ${{ steps.refs.outputs.picolibc }}
      jwlink: ${{ steps.refs.outputs.jwlink }}
      sdk: ${{ steps.refs.outputs.sdk }}
      win16: ${{ steps.refs.outputs.win16 }}
      win32: ${{ steps.refs.outputs.win32 }}
      amiga: ${{ steps.refs.outputs.amiga }}
      atari: ${{ steps.refs.outputs.atari }}
      sources: ${{ steps.refs.outputs.sources }}
      hosts: ${{ steps.refs.outputs.hosts }}
    steps:
      - id: refs
        env:
          LLVM_REF: ${{ inputs.llvm_ref || 'main' }}
          PICOLIBC_REF: ${{ inputs.picolibc_ref || 'main' }}
          JWLINK_REF: ${{ inputs.jwlink_ref || 'master' }}
          SDK_REF: ${{ inputs.sdk_ref || (github.repository == 'clang-dos/dos-sdk' && github.sha) || 'main' }}
          WIN16_REF: ${{ inputs.win16_sdk_ref || 'main' }}
          WIN32_REF: ${{ inputs.win32_sdk_ref || 'main' }}
          AMIGA_REF: ${{ inputs.amiga_sdk_ref || 'main' }}
          ATARI_REF: ${{ inputs.atari_sdk_ref || 'main' }}
          WINDOWS: ${{ inputs.windows }}
        run: |
          # A branch or tag name becomes the commit it names now, so that
          # every job builds the same sources.
          resolve() {
            case $2 in
              *[!0-9a-f]* | "") ;;
              ????????????????????????????????????????) echo "$2"; return ;;
            esac
            sha=$(git ls-remote "https://github.com/$1" "refs/heads/$2" "refs/tags/$2^{}" "refs/tags/$2" | awk 'NR == 1 { print $1 }')
            [ -n "$sha" ] || { echo "::error::$1 has no ref $2" >&2; exit 1; }
            echo "$sha"
          }
          llvm=$(resolve clang-dos/llvm "$LLVM_REF")
          picolibc=$(resolve clang-dos/picolibc "$PICOLIBC_REF")
          jwlink=$(resolve clang-dos/JWlink "$JWLINK_REF")
          sdk=$(resolve clang-dos/dos-sdk "$SDK_REF")
          win16=$(resolve clang-dos/win16-sdk "$WIN16_REF")
          win32=$(resolve clang-dos/win32-sdk "$WIN32_REF")
          amiga=$(resolve clang-dos/amiga-sdk "$AMIGA_REF")
          atari=$(resolve clang-dos/atari-sdk "$ATARI_REF")
          # Empty for a push or pull request here: both hosts.
          if [ "$WINDOWS" = false ]; then hosts='["linux"]'; else hosts='["linux","windows"]'; fi
          {
            echo "llvm=$llvm"
            echo "picolibc=$picolibc"
            echo "jwlink=$jwlink"
            echo "sdk=$sdk"
            echo "win16=$win16"
            echo "win32=$win32"
            echo "amiga=$amiga"
            echo "atari=$atari"
            echo "sources=llvm $llvm picolibc $picolibc jwlink $jwlink dos-sdk $sdk win16-sdk $win16 win32-sdk $win32 amiga-sdk $amiga atari-sdk $atari"
            echo "hosts=$hosts"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "clang-dos toolchain package: sources"
            echo "===================================="
            echo
            echo "Built $(date -u +%Y-%m-%d) by GitHub Actions: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "clang-dos/llvm      $llvm  ($LLVM_REF)"
            echo "clang-dos/picolibc  $picolibc  ($PICOLIBC_REF)"
            echo "clang-dos/JWlink    $jwlink  ($JWLINK_REF)"
            echo "clang-dos/dos-sdk   $sdk  ($SDK_REF)"
            echo "clang-dos/win16-sdk $win16  ($WIN16_REF)"
            echo "clang-dos/win32-sdk $win32  ($WIN32_REF)"
            echo "clang-dos/amiga-sdk $amiga  ($AMIGA_REF)"
            echo "clang-dos/atari-sdk $atari  ($ATARI_REF)"
            echo
            echo "Other sources:"
            echo "  mingw-w64 $MINGW_SHA (headers, CRT, import libraries)"
            echo "  libunicows 1.1.2 (Windows 9x sysroot's libunicows.a)"
            echo
            echo "Sysroots were built with packaging/build-sysroot.sh from dos-sdk,"
            echo "which takes the Windows parts from win16-sdk and win32-sdk and"
            echo "the AmigaOS one from amiga-sdk, whose AmigaOS headers are built"
            echo "from AROS at the commit in its tools/fetch-aros.sh. No NDK file"
            echo "is included. The Atari TOS sysroot comes from atari-sdk; no Atari"
            echo "ROM is included."
            echo "Linux host: clang on Ubuntu 24.04, libstdc++ linked statically."
            echo "Windows host: mingw-w64 GCC (posix threads), linked statically."
          } > BRANCHES.txt
          cat BRANCHES.txt
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: branches
          path: BRANCHES.txt
      # JWlink takes half a minute, so it is built here rather than in a job
      # of its own that would wait for a runner.
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/dos-sdk
          ref: ${{ steps.refs.outputs.sdk }}
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/JWlink
          ref: ${{ steps.refs.outputs.jwlink }}
          path: jwlink
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends gcc-mingw-w64-i686
      - name: Build JWlink
        run: |
          JWLINK_SRC=$PWD/jwlink sh sdk/packaging/build-jwlink.sh linux out/jwlink
          JWLINK_SRC=$PWD/jwlink sh sdk/packaging/build-jwlink.sh windows out/jwlink.exe
          file out/*
          test -x out/jwlink && test -f out/jwlink.exe
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: jwlink
          path: out/

  llvm-linux:
    name: LLVM (Linux host)
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      key: ${{ steps.llvm.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/dos-sdk
          ref: ${{ needs.setup.outputs.sdk }}
          path: sdk
          persist-credentials: false
      - uses: ./sdk/.github/actions/build-llvm
        id: llvm
        with:
          host: linux
          llvm-sha: ${{ needs.setup.outputs.llvm }}

  llvm-windows:
    name: LLVM (Windows host)
    needs: setup
    if: contains(needs.setup.outputs.hosts, 'windows')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/dos-sdk
          ref: ${{ needs.setup.outputs.sdk }}
          path: sdk
          persist-credentials: false
      - uses: ./sdk/.github/actions/build-llvm
        with:
          host: windows
          llvm-sha: ${{ needs.setup.outputs.llvm }}

  # Three jobs: DOS (picolibc, every memory model) with AmigaOS and Atari TOS
  # (picolibc for the 68000, a few minutes each), the five Windows sysroots on
  # mingw-w64's C runtime one after another, which together take about as
  # long, and the Windows sysroot with picolibc as the C library.
  sysroot:
    name: Sysroots (${{ matrix.group }})
    needs: [setup, llvm-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: dos
            names: i8086-msdos m68k-amigaos m68k-atari-tos
            source: picolibc
            winsdk: win16-sdk
          - group: windows
            names: win9x-msvcrt win9x-crtdll win2k-xp win-vista win-vista-x64
            source: mingw
            winsdk: win32-sdk
          # mingw-w64's Windows API headers and import libraries with picolibc.
          - group: win32-picolibc
            names: win32-picolibc
            source: mingw
            picolibc: true
            winsdk: win32-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/dos-sdk
          ref: ${{ needs.setup.outputs.sdk }}
          path: sdk
          persist-credentials: false
      # win16-sdk for the DOS sysroot (its Windows 1.x-3.x libraries),
      # win32-sdk for the Windows ones.
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/${{ matrix.winsdk }}
          ref: ${{ matrix.winsdk == 'win16-sdk' && needs.setup.outputs.win16 || needs.setup.outputs.win32 }}
          path: ${{ matrix.winsdk }}
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.group == 'dos'
        with:
          repository: clang-dos/amiga-sdk
          ref: ${{ needs.setup.outputs.amiga }}
          path: amiga-sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.group == 'dos'
        with:
          repository: clang-dos/atari-sdk
          ref: ${{ needs.setup.outputs.atari }}
          path: atari-sdk
          persist-credentials: false
      - name: Look for these sysroots in the cache
        id: cache
        uses: actions/cache@v4
        with:
          path: sysroot-*.tar
          key: sysroots-${{ matrix.group }}-${{ needs.setup.outputs.llvm }}-${{ matrix.source == 'picolibc' && format('{0}-{1}-{2}-{3}', needs.setup.outputs.picolibc, env.TVISION_SHA, needs.setup.outputs.amiga, needs.setup.outputs.atari) || env.MINGW_SHA }}-${{ matrix.picolibc && needs.setup.outputs.picolibc || 'none' }}-${{ matrix.winsdk == 'win16-sdk' && needs.setup.outputs.win16 || needs.setup.outputs.win32 }}-${{ hashFiles('sdk/scripts/**', 'sdk/runtime/**', 'sdk/graphics/**', 'sdk/tui/**', 'sdk/curses/**', 'sdk/cwin/**', 'sdk/cxl/**', 'sdk/tvision/**', 'sdk/packaging/build-sysroot.sh') }}
      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build cmake meson nasm make
      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: llvm-linux
      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: jwlink
          path: jwlink-bin
      - name: Unpack the tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir tools && tar -C tools -xf llvm-linux.tar
          install -m 755 jwlink-bin/jwlink tools/bin/jwlink
      # Only the runtimes' sources: the whole of llvm takes a minute to check out.
      # libc++ uses LLVM libc's shared headers (libc/shared) for charconv.
      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: clang-dos/llvm
          ref: ${{ needs.setup.outputs.llvm }}
          path: llvm
          fetch-depth: 1
          sparse-checkout: |
            cmake
            compiler-rt
            libc
            libcxx
            libcxxabi
            libunwind
            llvm/cmake
            llvm/utils/llvm-lit
            runtimes
            third-party
          persist-credentials: false
      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true' && (matrix.source == 'picolibc' || matrix.picolibc)
        with:
          repository: clang-dos/picolibc
          ref: ${{ needs.setup.outputs.picolibc }}
          path: picolibc
          persist-credentials: false
      - name: Get Turbo Vision
        if: steps.cache.outputs.cache-hit != 'true' && matrix.source == 'picolibc'
        run: |
          git init -q tvision
          git -C tvision fetch -q --depth 1 "$TVISION_REPO" "$TVISION_SHA"
          git -C tvision checkout -q FETCH_HEAD
      - name: Get mingw-w64 and libunicows
        if: steps.cache.outputs.cache-hit != 'true' && matrix.source == 'mingw'
        run: |
          git init -q mingw-w64
          git -C mingw-w64 fetch -q --depth 1 "$MINGW_REPO" "$MINGW_SHA"
          git -C mingw-w64 checkout -q FETCH_HEAD
          curl -sSfL --retry 5 -o libunicows.tar.gz "$LIBUNICOWS_URL"
          echo "$LIBUNICOWS_SHA256  libunicows.tar.gz" | sha256sum -c
          tar -xzf libunicows.tar.gz
          mv libunicows-1.1.2 libunicows
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for name in ${{ matrix.names }}; do
            echo "::group::$name"
            BIN=$PWD/tools/bin LLVM_SRC=$PWD/llvm PICOLIBC_SRC=$PWD/picolibc TVISION_SRC=$PWD/tvision \
            MINGW_SRC=$PWD/mingw-w64 LIBUNICOWS_SRC=$PWD/libunicows WORK=$PWD/work-$name \
            WIN16_SDK=$PWD/win16-sdk WIN32_SDK=$PWD/win32-sdk AMIGA_SDK=$PWD/amiga-sdk ATARI_SDK=$PWD/atari-sdk \
              sh sdk/packaging/build-sysroot.sh "$name" "sysroot-$name/sysroot"
            tar -cf "sysroot-$name.tar" -C "sysroot-$name" sysroot
            rm -rf "work-$name" "sysroot-$name"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: sysroots-${{ matrix.group }}
          path: sysroot-*.tar
          retention-days: 7

  # Packs the toolchain for one host and smoke-tests the archive it made.
  package:
    name: Package and smoke test (${{ matrix.host }} host)
    needs: [setup, llvm-linux, llvm-windows, sysroot]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.setup.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/dos-sdk
          ref: ${{ needs.setup.outputs.sdk }}
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/llvm
          ref: ${{ needs.setup.outputs.llvm }}
          path: llvm
          fetch-depth: 1
          sparse-checkout: llvm/LICENSE.TXT
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/picolibc
          ref: ${{ needs.setup.outputs.picolibc }}
          path: picolibc
          sparse-checkout: |
            COPYING.picolibc
            libos/msdos/README.md
            libos/amigaos/README.md
            libos/tos/README.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/JWlink
          ref: ${{ needs.setup.outputs.jwlink }}
          path: jwlink
          sparse-checkout: Ver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/win16-sdk
          ref: ${{ needs.setup.outputs.win16 }}
          path: win16-sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/win32-sdk
          ref: ${{ needs.setup.outputs.win32 }}
          path: win32-sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/amiga-sdk
          ref: ${{ needs.setup.outputs.amiga }}
          path: amiga-sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/atari-sdk
          ref: ${{ needs.setup.outputs.atari }}
          path: atari-sdk
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: llvm-${{ matrix.host }}
      - uses: actions/download-artifact@v4
        with:
          pattern: sysroots-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: jwlink
          path: jwlink-bin
      - uses: actions/download-artifact@v4
        with:
          name: branches
      - name: Assemble
        run: |
          mkdir llvm-install sysroots
          tar -C llvm-install -xf llvm-${{ matrix.host }}.tar
          for t in sysroot-*.tar; do
            n=${t#sysroot-}; n=${n%.tar}
            mkdir "sysroots/$n" && tar -C "sysroots/$n" --strip-components=1 -xf "$t"
          done
          case ${{ matrix.host }} in linux) jw=jwlink-bin/jwlink ;; windows) jw=jwlink-bin/jwlink.exe ;; esac
          name=clang-dos-${{ matrix.host }}-x86_64
          LLVM_PREFIX=$PWD/llvm-install JWLINK=$PWD/$jw SYSROOTS=$PWD/sysroots \
          LLVM_SRC=$PWD/llvm PICOLIBC_SRC=$PWD/picolibc JWLINK_SRC=$PWD/jwlink \
          WIN16_SDK=$PWD/win16-sdk WIN32_SDK=$PWD/win32-sdk AMIGA_SDK=$PWD/amiga-sdk ATARI_SDK=$PWD/atari-sdk \
          BRANCHES=$PWD/BRANCHES.txt \
            sh sdk/packaging/assemble.sh ${{ matrix.host }} "dist/$name"
      # The headers of win16-sdk against Wine's .spec files and mingw-w64,
      # with the compiler and a Win32 sysroot of this package.
      - name: Check the Win16 headers
        if: matrix.host == 'linux'
        run: |
          [ -f win16-sdk/tools/check-headers.py ] || exit 0
          git clone -q --depth 1 --branch "$WINE_SPECS_TAG" --filter=blob:none \
            --sparse https://gitlab.winehq.org/wine/wine.git wine-specs
          git -C wine-specs sparse-checkout set --no-cone '/dlls/*16/*.spec'
          pkg=$PWD/dist/clang-dos-linux-x86_64
          python3 win16-sdk/tools/check-headers.py --clang "$pkg/bin/clang" \
            --wine wine-specs/dlls --mingw-sysroot "$pkg/sysroots/win9x-msvcrt"
      # The redistributable Win16 and Win32 SDK archives, made from the
      # Linux package by each SDK's tools/make-dist.sh.
      - name: SDK archives
        if: matrix.host == 'linux'
        run: |
          mkdir -p sdk-dist
          for s in win16-sdk win32-sdk; do
            if [ -f "$s/tools/make-dist.sh" ]; then
              sh "$s/tools/make-dist.sh" dist/clang-dos-linux-x86_64 \
                "sdk-dist/clang-dos-$s.tar.xz"
            fi
          done
          ls -l sdk-dist
      - uses: actions/upload-artifact@v4
        if: matrix.host == 'linux'
        with:
          if-no-files-found: ignore
          name: clang-dos-sdks
          path: sdk-dist/*
          compression-level: 0
      - name: Archive
        run: |
          name=clang-dos-${{ matrix.host }}-x86_64
          cd dist
          if [ ${{ matrix.host }} = linux ]; then
            tar -cf - "$name" | xz -T0 -9 > "$name.tar.xz"
          else
            sudo apt-get install -y -q --no-install-recommends p7zip-full zip >/dev/null
            zip -qr -9 "$name.zip" "$name"
            7z a -bd -mx=9 "$name.7z" "$name" >/dev/null
          fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: clang-dos-${{ matrix.host }}-x86_64
          path: dist/*
          compression-level: 0
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends wine wine32:i386 wine64 xvfb xauth
          wine --version
      # vamos (from amitools) runs AmigaOS CLI programs without a Kickstart ROM.
      - name: Install vamos
        run: |
          python3 -m venv "$RUNNER_TEMP/amitools"
          "$RUNNER_TEMP/amitools/bin/pip" install -q amitools machine68k==0.3.0
          echo "$RUNNER_TEMP/amitools/bin" >> "$GITHUB_PATH"
      # Hatari with EmuTOS (free, GPL) runs the Atari programs; no Atari
      # ROM is used.
      - name: Install Hatari and EmuTOS
        run: |
          sudo apt-get install -y -q --no-install-recommends hatari
          mkdir -p "$RUNNER_TEMP/emutos" && cd "$RUNNER_TEMP/emutos"
          for z in 192k:$EMUTOS_192K_SHA256 512k:$EMUTOS_512K_SHA256; do
            f=emutos-${z%%:*}-$EMUTOS_VERSION.zip
            curl -sSfL --retry 5 -o "$f" "https://downloads.sourceforge.net/project/emutos/emutos/$EMUTOS_VERSION/$f"
            echo "${z#*:}  $f" | sha256sum -c
            unzip -q -j "$f" '*/etos*us.img'
          done
          echo "EMUTOS_DIR=$RUNNER_TEMP/emutos" >> "$GITHUB_ENV"
      - name: Get emu2
        id: emu2
        uses: actions/cache@v4
        with:
          path: emu2/emu2
          key: emu2-${{ env.EMU2_SHA }}
      - name: Build emu2
        if: steps.emu2.outputs.cache-hit != 'true'
        run: |
          git init -q emu2
          git -C emu2 fetch -q --depth 1 "$EMU2_REPO" "$EMU2_SHA"
          git -C emu2 checkout -q FETCH_HEAD
          make -C emu2 -j"$(nproc)"
      - name: Unpack
        run: |
          mkdir smoke && cd smoke
          if [ ${{ matrix.host }} = linux ]; then
            tar -xJf ../dist/clang-dos-linux-x86_64.tar.xz
          else
            unzip -q ../dist/clang-dos-windows-x86_64.zip
          fi
      - name: Start Wine
        run: |
          export WINEDEBUG=-all
          xvfb-run -a wineboot --init
          wineserver -w
      - name: Smoke test
        run: |
          pkg=$PWD/smoke/clang-dos-${{ matrix.host }}-x86_64
          hostrun=; [ ${{ matrix.host }} = windows ] && hostrun=wine
          HOSTRUN=$hostrun EMU2=$PWD/emu2/emu2 WINE=wine VAMOS=vamos OUT=$PWD/smoke-out \
            xvfb-run -a sh "$pkg/smoke-test.sh" 2>&1 | tee smoke.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-out-${{ matrix.host }}
          path: smoke-out/
          retention-days: 7

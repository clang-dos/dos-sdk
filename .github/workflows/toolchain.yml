# Build the clang-dos toolchain packages (Linux and Windows hosts) from
# clang-dos/llvm, picolibc, JWlink and this repository, and smoke-test them
# on every target in emu2 and Wine.
#
# It runs for pushes and pull requests here, and the other clang-dos
# repositories call it (workflow_call) for their own pull requests with their
# commit in place of the default branch. release.yml calls it to publish.
#
# The LLVM build is the slow part: about two hours for Linux and three for
# Windows on a cold cache. Each LLVM commit is built once per host and kept
# in the Actions cache, so a change here or in picolibc reuses it, and a
# compiler cache (ccache) makes a new LLVM commit quick to build.
name: Toolchain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      llvm_ref:
        description: clang-dos/llvm branch, tag or commit
        default: main
      picolibc_ref:
        description: clang-dos/picolibc branch, tag or commit
        default: main
      jwlink_ref:
        description: clang-dos/JWlink branch, tag or commit
        default: master
      windows:
        description: Build the Windows-hosted package too
        type: boolean
        default: true
  workflow_call:
    inputs:
      llvm_ref:
        type: string
        default: main
      picolibc_ref:
        type: string
        default: main
      jwlink_ref:
        type: string
        default: master
      sdk_ref:
        description: clang-dos/dos-sdk ref (default main, or this commit when run here)
        type: string
        default: ''
      windows:
        type: boolean
        default: true
    outputs:
      sources:
        description: The four source commits, as one line for release notes
        value: ${{ jobs.setup.outputs.sources }}

permissions:
  contents: read

# github.workflow is the calling workflow's name when this one is called, so
# a caller (which should set no concurrency of its own) gets its own group.
concurrency:
  group: toolchain-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # mingw-w64 for the Windows sysroots, and the other outside sources.
  MINGW_REPO: https://github.com/mingw-w64/mingw-w64
  MINGW_SHA: 7ce22f6637cc93fd2eb37c8a645908c92bb80bbd
  LIBUNICOWS_URL: https://downloads.sourceforge.net/project/libunicows/libunicows/1.1.2/libunicows-1.1.2-src.tar.gz
  LIBUNICOWS_SHA256: 4371837276fde33b5684556f4c8e37c348b330c2981d99626300c25b4d876a06
  EMU2_REPO: https://github.com/dmsc/emu2
  EMU2_SHA: 9d8698d06e67359bc8b230c2d19d5b1503e60819
  # Turbo Vision, patched by tvision/clang-dos.patch (see tvision/README.md).
  TVISION_REPO: https://github.com/magiblot/tvision
  TVISION_SHA: b5fc1e50dcc2da062d72f43eb3662894d25aaf30

jobs:
  setup:
    name: Pick the source commits
    runs-on: ubuntu-24.04
    outputs:
      llvm: ${{ steps.refs.outputs.llvm }}
      picolibc: ${{ steps.refs.outputs.picolibc }}
      jwlink: ${{ steps.refs.outputs.jwlink }}
      sdk: ${{ steps.refs.outputs.sdk }}
      sources: ${{ steps.refs.outputs.sources }}
      hosts: ${{ steps.refs.outputs.hosts }}
    steps:
      - id: refs
        env:
          LLVM_REF: ${{ inputs.llvm_ref || 'main' }}
          PICOLIBC_REF: ${{ inputs.picolibc_ref || 'main' }}
          JWLINK_REF: ${{ inputs.jwlink_ref || 'master' }}
          SDK_REF: ${{ inputs.sdk_ref || (github.repository == 'clang-dos/dos-sdk' && github.sha) || 'main' }}
          WINDOWS: ${{ inputs.windows }}
        run: |
          # A branch or tag name becomes the commit it names now, so that
          # every job builds the same sources.
          resolve() {
            case $2 in
              *[!0-9a-f]* | "") ;;
              ????????????????????????????????????????) echo "$2"; return ;;
            esac
            sha=$(git ls-remote "https://github.com/$1" "refs/heads/$2" "refs/tags/$2^{}" "refs/tags/$2" | awk 'NR == 1 { print $1 }')
            [ -n "$sha" ] || { echo "::error::$1 has no ref $2" >&2; exit 1; }
            echo "$sha"
          }
          llvm=$(resolve clang-dos/llvm "$LLVM_REF")
          picolibc=$(resolve clang-dos/picolibc "$PICOLIBC_REF")
          jwlink=$(resolve clang-dos/JWlink "$JWLINK_REF")
          sdk=$(resolve clang-dos/dos-sdk "$SDK_REF")
          # Empty for a push or pull request here: both hosts.
          if [ "$WINDOWS" = false ]; then hosts='["linux"]'; else hosts='["linux","windows"]'; fi
          {
            echo "llvm=$llvm"
            echo "picolibc=$picolibc"
            echo "jwlink=$jwlink"
            echo "sdk=$sdk"
            echo "sources=llvm $llvm picolibc $picolibc jwlink $jwlink dos-sdk $sdk"
            echo "hosts=$hosts"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "clang-dos toolchain package: sources"
            echo "===================================="
            echo
            echo "Built $(date -u +%Y-%m-%d) by GitHub Actions: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "clang-dos/llvm      $llvm  ($LLVM_REF)"
            echo "clang-dos/picolibc  $picolibc  ($PICOLIBC_REF)"
            echo "clang-dos/JWlink    $jwlink  ($JWLINK_REF)"
            echo "clang-dos/dos-sdk   $sdk  ($SDK_REF)"
            echo
            echo "Other sources:"
            echo "  mingw-w64 $MINGW_SHA (headers, CRT, import libraries)"
            echo "  libunicows 1.1.2 (Windows 9x sysroot's libunicows.a)"
            echo
            echo "Sysroots were built with packaging/build-sysroot.sh from dos-sdk."
            echo "Linux host: clang on Ubuntu 24.04, libstdc++ linked statically."
            echo "Windows host: mingw-w64 GCC (posix threads), linked statically."
          } > BRANCHES.txt
          cat BRANCHES.txt
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: branches
          path: BRANCHES.txt

  llvm-linux:
    name: LLVM (Linux host)
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/dos-sdk
          ref: ${{ needs.setup.outputs.sdk }}
          path: sdk
          persist-credentials: false
      - uses: ./sdk/.github/actions/build-llvm
        with:
          host: linux
          llvm-sha: ${{ needs.setup.outputs.llvm }}

  llvm-windows:
    name: LLVM (Windows host)
    needs: setup
    if: contains(needs.setup.outputs.hosts, 'windows')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/dos-sdk
          ref: ${{ needs.setup.outputs.sdk }}
          path: sdk
          persist-credentials: false
      - uses: ./sdk/.github/actions/build-llvm
        with:
          host: windows
          llvm-sha: ${{ needs.setup.outputs.llvm }}

  jwlink:
    name: JWlink
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/dos-sdk
          ref: ${{ needs.setup.outputs.sdk }}
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/JWlink
          ref: ${{ needs.setup.outputs.jwlink }}
          path: jwlink
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends gcc-mingw-w64-i686
      - run: |
          JWLINK_SRC=$PWD/jwlink sh sdk/packaging/build-jwlink.sh linux out/jwlink
          JWLINK_SRC=$PWD/jwlink sh sdk/packaging/build-jwlink.sh windows out/jwlink.exe
          file out/*
          test -x out/jwlink && test -f out/jwlink.exe
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: jwlink
          path: out/

  sysroot:
    name: Sysroot ${{ matrix.name }}
    needs: [setup, llvm-linux, jwlink]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        name: [i8086-msdos, win9x-msvcrt, win9x-crtdll, win2k-xp, win-vista, win-vista-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/dos-sdk
          ref: ${{ needs.setup.outputs.sdk }}
          path: sdk
          persist-credentials: false
      - name: Look for this sysroot in the cache
        id: cache
        uses: actions/cache@v4
        with:
          path: sysroot
          key: sysroot-${{ matrix.name }}-${{ needs.setup.outputs.llvm }}-${{ matrix.name == 'i8086-msdos' && format('{0}-{1}', needs.setup.outputs.picolibc, env.TVISION_SHA) || env.MINGW_SHA }}-${{ hashFiles('sdk/scripts/**', 'sdk/win9x/*.sh', 'sdk/win16/**', 'sdk/runtime/**', 'sdk/graphics/**', 'sdk/tui/**', 'sdk/tvision/**', 'sdk/packaging/build-sysroot.sh', 'sdk/packaging/build-modern-sysroot.sh') }}
      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build cmake meson nasm make
      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: llvm-linux
      - uses: actions/download-artifact@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: jwlink
          path: jwlink-bin
      - name: Unpack the tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir tools && tar -C tools -xf llvm-linux.tar
          install -m 755 jwlink-bin/jwlink tools/bin/jwlink
      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: clang-dos/llvm
          ref: ${{ needs.setup.outputs.llvm }}
          path: llvm
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true' && matrix.name == 'i8086-msdos'
        with:
          repository: clang-dos/picolibc
          ref: ${{ needs.setup.outputs.picolibc }}
          path: picolibc
          persist-credentials: false
      - name: Get Turbo Vision
        if: steps.cache.outputs.cache-hit != 'true' && matrix.name == 'i8086-msdos'
        run: |
          git init -q tvision
          git -C tvision fetch -q --depth 1 "$TVISION_REPO" "$TVISION_SHA"
          git -C tvision checkout -q FETCH_HEAD
      - name: Get mingw-w64
        if: steps.cache.outputs.cache-hit != 'true' && matrix.name != 'i8086-msdos'
        run: |
          git init -q mingw-w64
          git -C mingw-w64 fetch -q --depth 1 "$MINGW_REPO" "$MINGW_SHA"
          git -C mingw-w64 checkout -q FETCH_HEAD
      - name: Get libunicows
        if: steps.cache.outputs.cache-hit != 'true' && matrix.name == 'win9x-msvcrt'
        run: |
          curl -sSfL --retry 5 -o libunicows.tar.gz "$LIBUNICOWS_URL"
          echo "$LIBUNICOWS_SHA256  libunicows.tar.gz" | sha256sum -c
          tar -xzf libunicows.tar.gz
          mv libunicows-1.1.2 libunicows
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          BIN=$PWD/tools/bin LLVM_SRC=$PWD/llvm PICOLIBC_SRC=$PWD/picolibc TVISION_SRC=$PWD/tvision \
          MINGW_SRC=$PWD/mingw-w64 LIBUNICOWS_SRC=$PWD/libunicows WORK=$PWD/work \
            sh sdk/packaging/build-sysroot.sh "${{ matrix.name }}" sysroot
      - name: Pack
        run: tar -cf sysroot-${{ matrix.name }}.tar sysroot
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: sysroot-${{ matrix.name }}
          path: sysroot-${{ matrix.name }}.tar
          retention-days: 7

  package:
    name: Package (${{ matrix.host }} host)
    needs: [setup, llvm-linux, llvm-windows, jwlink, sysroot]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        host: ${{ fromJSON(needs.setup.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/dos-sdk
          ref: ${{ needs.setup.outputs.sdk }}
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/llvm
          ref: ${{ needs.setup.outputs.llvm }}
          path: llvm
          fetch-depth: 1
          sparse-checkout: llvm/LICENSE.TXT
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/picolibc
          ref: ${{ needs.setup.outputs.picolibc }}
          path: picolibc
          sparse-checkout: |
            COPYING.picolibc
            libos/msdos/README.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: clang-dos/JWlink
          ref: ${{ needs.setup.outputs.jwlink }}
          path: jwlink
          sparse-checkout: Ver
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: llvm-${{ matrix.host }}
      - uses: actions/download-artifact@v4
        with:
          pattern: sysroot-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: jwlink
          path: jwlink-bin
      - uses: actions/download-artifact@v4
        with:
          name: branches
      - name: Assemble
        run: |
          mkdir llvm-install sysroots
          tar -C llvm-install -xf llvm-${{ matrix.host }}.tar
          for t in sysroot-*.tar; do
            n=${t#sysroot-}; n=${n%.tar}
            mkdir "sysroots/$n" && tar -C "sysroots/$n" --strip-components=1 -xf "$t"
          done
          case ${{ matrix.host }} in linux) jw=jwlink-bin/jwlink ;; windows) jw=jwlink-bin/jwlink.exe ;; esac
          name=clang-dos-${{ matrix.host }}-x86_64
          LLVM_PREFIX=$PWD/llvm-install JWLINK=$PWD/$jw SYSROOTS=$PWD/sysroots \
          LLVM_SRC=$PWD/llvm PICOLIBC_SRC=$PWD/picolibc JWLINK_SRC=$PWD/jwlink \
          BRANCHES=$PWD/BRANCHES.txt \
            sh sdk/packaging/assemble.sh ${{ matrix.host }} "dist/$name"
      - name: Archive
        run: |
          name=clang-dos-${{ matrix.host }}-x86_64
          cd dist
          if [ ${{ matrix.host }} = linux ]; then
            tar -cf - "$name" | xz -T0 -9 > "$name.tar.xz"
          else
            sudo apt-get install -y -q --no-install-recommends p7zip-full zip >/dev/null
            zip -qr -9 "$name.zip" "$name"
            7z a -bd -mx=9 "$name.7z" "$name" >/dev/null
          fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: clang-dos-${{ matrix.host }}-x86_64
          path: dist/*
          compression-level: 0

  smoke-test:
    name: Smoke test (${{ matrix.host }} host)
    needs: [setup, package]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.setup.outputs.hosts) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clang-dos-${{ matrix.host }}-x86_64
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends wine wine32:i386 wine64 xvfb xauth
          wine --version
      - name: Get emu2
        id: emu2
        uses: actions/cache@v4
        with:
          path: emu2/emu2
          key: emu2-${{ env.EMU2_SHA }}
      - name: Build emu2
        if: steps.emu2.outputs.cache-hit != 'true'
        run: |
          git init -q emu2
          git -C emu2 fetch -q --depth 1 "$EMU2_REPO" "$EMU2_SHA"
          git -C emu2 checkout -q FETCH_HEAD
          make -C emu2 -j"$(nproc)"
      - name: Unpack
        run: |
          if [ ${{ matrix.host }} = linux ]; then
            tar -xJf clang-dos-linux-x86_64.tar.xz
          else
            unzip -q clang-dos-windows-x86_64.zip
          fi
      - name: Start Wine
        run: |
          export WINEDEBUG=-all
          xvfb-run -a wineboot --init
          wineserver -w
      - name: Smoke test
        run: |
          pkg=$PWD/clang-dos-${{ matrix.host }}-x86_64
          hostrun=; [ ${{ matrix.host }} = windows ] && hostrun=wine
          HOSTRUN=$hostrun EMU2=$PWD/emu2/emu2 WINE=wine OUT=$PWD/smoke-out \
            xvfb-run -a sh "$pkg/smoke-test.sh" 2>&1 | tee smoke.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-out-${{ matrix.host }}
          path: smoke-out/
          retention-days: 7

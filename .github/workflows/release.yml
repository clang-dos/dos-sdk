# Publish the clang-dos toolchain packages as a GitHub release.
#
# - Pushing a tag v* here makes a release of that name, built from this
#   commit and the default branches of llvm, picolibc and JWlink.
# - Every night, when any of the seven repositories has changed, the
#   "nightly" pre-release is rebuilt from the default branches.
# - Run it by hand (Actions > Release > Run workflow) for a nightly now, or
#   with a tag name for a release from chosen branches.
#
# Each release has the Linux tarball, the Windows .zip and .7z, the Win16
# and Win32 SDK archives (from the Linux package), each sysroot alone
# (clang-dos-sysroot-NAME.tar.xz), BRANCHES.txt (the source commits) and
# SHA256SUMS, and only packages that passed the smoke test are published.
#
# Other repositories' CI takes the nightly with
# .github/actions/setup-toolchain, and anyone with packaging/get-toolchain.sh;
# the nightly's assets are replaced in place, so its links do not change.
name: Release

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, such as v0.2.0 (empty for the nightly pre-release)
        default: ''
      llvm_ref:
        description: clang-dos/llvm branch, tag or commit
        default: main
      picolibc_ref:
        description: clang-dos/picolibc branch, tag or commit
        default: main
      jwlink_ref:
        description: clang-dos/JWlink branch, tag or commit
        default: master

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Decide what to publish
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.what.outputs.tag }}
      skip: ${{ steps.what.outputs.skip }}
    steps:
      - id: what
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=${INPUT_TAG:-nightly}
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          skip=false
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            # Skip the nightly when no repository has moved since the last one.
            head() { git ls-remote "https://github.com/clang-retro/$1" "refs/heads/$2" | cut -f1; }
            now="llvm $(head llvm main) picolibc $(head picolibc main) jwlink $(head JWlink master) dos-sdk $GITHUB_SHA win16-sdk $(head win16-sdk main) win32-sdk $(head win32-sdk main) amiga-sdk $(head amiga-sdk main) atari-sdk $(head atari-sdk main)"
            # No nightly yet (or an unreadable one) means build it.
            body=$(gh release view nightly --json body -q .body 2>/dev/null || true)
            last=$(printf '%s\n' "$body" | sed -n 's/^<!-- sources: \(.*\) -->$/\1/p')
            echo "now:  $now"
            echo "last: $last"
            [ "$now" = "$last" ] && skip=true
          fi
          echo "skip=$skip" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    uses: ./.github/workflows/toolchain.yml
    with:
      llvm_ref: ${{ inputs.llvm_ref || 'main' }}
      picolibc_ref: ${{ inputs.picolibc_ref || 'main' }}
      jwlink_ref: ${{ inputs.jwlink_ref || 'master' }}
      windows: true

  publish:
    name: Publish ${{ needs.check.outputs.tag }}
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: clang-dos-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: branches
          path: dist
      # Each sysroot alone, as in the packages, for builds that need only
      # one (packaging/get-toolchain.sh -s NAME).
      - uses: actions/download-artifact@v4
        with:
          pattern: sysroots-*
          path: sysroots
          merge-multiple: true
      - name: Sysroot archives
        run: |
          for t in sysroots/sysroot-*.tar; do
            n=${t#sysroots/sysroot-}; n=${n%.tar}
            mkdir -p "x/$n" && tar -C "x/$n" --strip-components=1 -xf "$t"
            tar -C x -cf - "$n" | xz -T0 -9 > "dist/clang-dos-sysroot-$n.tar.xz"
            rm -rf "x/$n" "$t"
          done
          ls -l dist
      - name: Checksums and notes
        env:
          TAG: ${{ needs.check.outputs.tag }}
          SOURCES: ${{ needs.build.outputs.sources }}
        run: |
          cd dist
          sha256sum clang-dos-* BRANCHES.txt > SHA256SUMS
          cat SHA256SUMS
          {
            if [ "$TAG" = nightly ]; then
              echo "Nightly build of the clang-dos toolchain from the default branches, $(date -u +%Y-%m-%d)."
            else
              echo "clang-dos toolchain $TAG."
            fi
            echo
            echo "- \`clang-dos-linux-x86_64.tar.xz\`: Linux x86_64 host (Ubuntu 24.04, Debian 13, Fedora 39 or newer)"
            echo "- \`clang-dos-windows-x86_64.zip\` or \`.7z\` (same contents): Windows 10 or later, x86_64 host"
            echo "- \`clang-dos-sysroot-NAME.tar.xz\`: each sysroot of the packages alone (i8086-msdos, m68k-amigaos, m68k-atari-tos and the Windows ones), for \`packaging/get-toolchain.sh -s NAME\`"
            echo "- \`clang-dos-win16-sdk.tar.xz\`, \`clang-dos-win32-sdk.tar.xz\`: the Windows SDKs alone (headers, import lists, libraries, config files and licences), to unpack over a package; every file in them can be passed on (see NOTICE.md in share/licenses)"
            echo
            echo "Unpack anywhere and see README.md inside for the targets and their \`--config\` files."
            if [ "$TAG" = nightly ]; then
              echo "In GitHub Actions: \`uses: clang-retro/dos-sdk/.github/actions/setup-toolchain@main\` downloads and unpacks the Linux package and puts it on \`PATH\`. Elsewhere: \`packaging/get-toolchain.sh DIR\` from clang-retro/dos-sdk. The download links of this release stay the same from night to night."
            fi
            echo "Both packages passed smoke-test.sh (every target built, checked and run in emu2 and Wine)."
            echo
            echo '```'
            cat BRANCHES.txt
            echo '```'
            echo
            echo "<!-- sources: $SOURCES -->"
          } > ../notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          title="Nightly $(date -u +%Y-%m-%d)"
          if [ "$TAG" = nightly ] && gh release view nightly >/dev/null 2>&1; then
            # Replace the assets in place, so that the download links never
            # stop working, then drop the ones this build did not make and
            # move the tag to this commit.
            gh release upload nightly dist/* --clobber
            gh api "repos/$GH_REPO/releases/tags/nightly" --jq '.assets[] | "\(.id) \(.name)"' |
            while read -r id name; do
              [ -e "dist/$name" ] || { echo "Deleting $name"; gh api -X DELETE "repos/$GH_REPO/releases/assets/$id"; }
            done
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit nightly --prerelease --title "$title" --notes-file notes.md
          elif [ "$TAG" = nightly ]; then
            gh release create nightly dist/* --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "$title" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "clang-dos $TAG" --notes-file notes.md
          fi
